name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependency
        run: python -m pip install --upgrade Pillow
      - name: Gateway tests
        run: env -u PYTHONPATH -u PYTHONHOME PYTHONPATH="$GITHUB_WORKSPACE/gateway/test_support" python -W error::ResourceWarning -m unittest discover -s gateway -p 'test_*.py'
      - name: Tool tests
        run: env -u PYTHONPATH -u PYTHONHOME python -m unittest discover -s tools -p 'test_*.py'
