; alicenet-x4 firmware: Xteink X4 (ESP32-C3) ambient endpoint for Alicenet.
;
; SAFETY: never `pio run -t upload`. Upload writes boot_app0 + the app at 0x10000
; (= ota_0), which is CrossInk. Install via CrossInk's SD Firmware Update instead;
; it writes the *other* slot (ota_1). The custom upload_command below refuses.
;
; freeink-sdk is a nested checkout pinned to e41f683, the exact SDK commit of the
; Escape Hatch build that ran correctly on this unit on 2026-10-03.

[platformio]
default_envs = x4
build_cache_dir = .cache

[env:x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600   ; one OTA slot (0x640000); a bigger image can't be SD-flashed
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

upload_protocol = custom
upload_command = echo "REFUSED: pio upload would overwrite ota_0 (CrossInk). Use the SD flasher; see firmware/README.md" && exit 1

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X4=1
  -DENABLE_SERIAL_LOG=1
  -DALICENET_FW_VERSION=\"0.2.4-net\"
  -std=gnu++2a
  -fno-exceptions
build_unflags =
  -std=gnu++11
  -fexceptions

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  RecoveryBoot=symlink://freeink-sdk/libs/hardware/RecoveryBoot
